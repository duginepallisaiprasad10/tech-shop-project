<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/signup.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>

<body style="background-color: black;">
   
    <div class="signup" style="background-color:rgb(17, 16, 16);">
        

        <form>
            <svg xmlns="http://www.w3.org/2000/svg" width="45" height="30" fill="currentColor" class="bi bi-x del" viewBox="0 0 16 16">
                <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
              </svg>

            <h1 class="up">Signup</h1>
            <p class="top">Already have an account ? <span> Login</span></p>



            <!--  -->


            <!-- <br> -->


            <input type="text" placeholder="username"
                style="width: 320px;  height: 40px; color: whitesmoke; background-color: black; border:  2px solid rgb(129, 125, 125);">
            <br>
            <br>
            <input type="text" placeholder="Email"
                style="width: 320px;  height: 40px;color: whitesmoke; background-color: black; border:  2px solid grey;">
            <br>
            <br>
            <input type="password" placeholder="password"
                style="width: 320px;  height: 40px;color: whitesmoke; background-color: black; border:  2px solid grey;">
            <br>
            <br>
            <input type="password" placeholder="Confirm password"
                style="width: 320px;  height: 40px;color: whitesmoke; background-color: black; border:  2px solid grey;">
            <br>
            <br>
            <button type="button"
                style="width: 325px;  height: 40px; color: whitesmoke; background-color: red; border: 2px solid red;">Signup</button>
            <br>
            <br>

            <!--  -->

            <div style="display: flex; align-items: center; justify-content: center; color: whitesmoke;">

                <hr style="flex: 1; border: none; height: 1px; background-color: white; margin: 10px; ">
                <span style="padding: 0 10px;">Or Login with</span>
                <hr style="flex: 1; border: none; height: 1px; background-color: white; margin: 10px;">

            </div>

            <!--  -->

            <!--  -->

            <div style="display: flex; justify-content: space-between; padding: 20px; margin-right: 15px;">

                <button type="button" class="btn"
                    style="color: whitesmoke; background-color: darkblue; border: 2px solid darkblue;">Facebook</button>
                <button type="button" class="btn"
                    style="color: whitesmoke; background-color: red; border:  2px solid red;">Google</button>
                <button type="button" class="btn"
                    style="color: whitesmoke; background-color: dodgerblue; border: 2px solid dodgerblue;">Twitter</button>



            </div>

        </form>
    </div> 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
